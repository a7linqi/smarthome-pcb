name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jiaohua-rtos/android-app/**"
      - "jiaohua-rtos/mobile-dashboard/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: jiaohua-rtos/android-app
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JiaoHua-debug-apk
          path: jiaohua-rtos/android-app/app/build/outputs/apk/debug/app-debug.apk
