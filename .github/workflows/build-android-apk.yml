name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "jiaohua-app-v*"
    paths:
      - "jiaohua-rtos/android-app/**"
      - "jiaohua-rtos/mobile-dashboard/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: jiaohua-rtos/android-app
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JiaoHua-debug-apk
          path: jiaohua-rtos/android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish tagged APK release
        if: startsWith(github.ref, 'refs/tags/jiaohua-app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp jiaohua-rtos/android-app/app/build/outputs/apk/debug/app-debug.apk JiaoHua-v1.0.0.apk
          gh release create "$GITHUB_REF_NAME" JiaoHua-v1.0.0.apk \
            --title "智能浇花 APP v1.0.0" \
            --notes "STM32 + ESP8266 智能浇花系统 Android 测试版。安装后通过 MQTT 直接连接设备。"
